
[package]
name = "data"
edition.workspace = true
version.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
description.workspace = true
categories.workspace = true
license-file.workspace = true
keywords.workspace = true

[lints]
workspace = true

[features]
debug = []

[dependencies]
ddo_core = { path = "../core" }
rust_decimal = "1.42.1"
ron = "0.12.1"
serde = { version = "1.0.228" }
anyhow = "1.0.102"
paste = "1.0"

[build-dependencies]
ddo_core = { path = "../core" }
ron = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
anyhow = "1.0.102"
itertools = "0.14.0"


[dev-dependencies]
data = { path = ".", features = ["debug"] }
ddo_core = { path = "../core", features = ["debug"] }
